[package]
name = "hikari_rei"
version = "0.2.0"
edition = "2024"
description = "Rust reimplementation of SoRA_X7's Hikari Tetris AI"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
